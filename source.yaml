canonical:
  # for source = Local
  # ==========
  type: local
  path: ./config/local-config.yaml
  # --- OR ---
  # path: ./config/local-config.toml
  # --- OR ---
  # path: ./config/local.env

  # for source = Git
  # ==========
  # type: git
  # repo: https://github.com/neel-03/configdrift.git
  # branch: test/remote_config
  # path: config.yaml
  # auth_token: $GITHUB_ACCESS_TOKEN
  # --- OR ---
  # repo: [any_git_repo]
  # branch: master
  # path: examples/example.toml
  # --- OR ---
  # path: .env.example

  # for source = S3
  # ==========
  # type: s3
  # bucket: $CONFIGDRIFT_S3_BUCKET_NAME
  # region: $AWS_REGION
  # path: config/s3-config.yaml
  # --- OR ---
  # path: config/s3-config.toml
  # --- OR ---
  # path: config/s3.env

interval: 20s

targets:
  - name: local-ssh-yaml
    type: ssh
    host: localhost
    user: neel
    key: /home/neel/.ssh/id_ed25519
    path: /tmp/target-config.yaml
    # known_hosts: /home/neel/.ssh/known_hosts  # optional, defaults to ~/.ssh/known_hosts
    # timeout: 10s                             # optional duration

  - name: local-ssh-toml
    type: ssh
    host: localhost
    user: neel
    key: /home/neel/.ssh/id_ed25519
    path: /tmp/target-config.toml
